<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- pixel block background -->
  <rect width="16" height="16" fill="#0B0B0B"/>
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3A3A3A" stroke-width="1"/>
  <!-- inner bevel highlight (top-left) -->
  <rect x="1" y="1" width="14" height="1" fill="#2A2A2A"/>
  <rect x="1" y="1" width="1" height="14" fill="#2A2A2A"/>
  <!-- pixel "H" in white -->
  <rect x="4"  y="3" width="2" height="10" fill="#F4F4F4"/>
  <rect x="10" y="3" width="2" height="10" fill="#F4F4F4"/>
  <rect x="6"  y="7" width="4" height="2"  fill="#F4F4F4"/>
</svg>
